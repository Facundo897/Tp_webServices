<div class="container my-5">
  <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-light-subtle pb-2">
    <h2 class="text-dark text-uppercase fs-4 fw-bold m-0 tracking-wide">Lista de Películas Recomendadas</h2>
  </div>

  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
    <div class="col" *ngFor="let p of peliculas | slice:0:6">  <!--Es un filtro solo mostrara 6 peliculas-->
      <div class="card h-100 bg-white text-dark border border-light-subtle shadow-sm p-3 rounded-4" >
        <img [src]="p.image" class="card-img-top rounded-4 object-fit-cover" alt="El Padrino" style="height: 180px;">
        
        <div class="card-body px-1 pt-3 pb-0">
          <h5 class="card-title text-uppercase fw-bold mb-2 fs-5 text-dark">{{p.title}}</h5>
          
          <p class="card-text text-muted small mb-3 text-truncate-3">{{p.description}}</p>
          
          <div class="d-flex align-items-center gap-1">
            <span class="text-muted small me-1">Gér:</span>
            <span class="badge rounded-pill bg-success px-2 py-1 text-white fw-bold"
            style="font-size: 0.75rem;" *ngFor="let g of p.genre">{{g}}</span>
          
          </div>
          
        </div>
      </div>
    </div>

  </div>
</div>
