<div class="container my-5">
  <div class="d-flex align-items-center mb-4 border-bottom border-light-subtle pb-2">
    <h2 class="text-dark text-uppercase fs-4 fw-bold m-0 tracking-wide">Marcas de Carros de Lujo</h2>
  </div>
  
  <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
    <div class="col" *ngFor="let m of marcas()">
      <div class="card bg-white border border-light-subtle shadow-sm rounded-3">
        <button type="button" class="btn btn-light text-start p-3 fw-semibold w-100 d-flex justify-content-between align-items-center" (click)="mostrarModelos(m.id)" data-bs-target="#modalModelos" data-bs-toggle="modal">
          <span>🚗 {{m.name}}</span></button>
      </div>
    </div>
  </div>

</div>

<div class="modal fade" id="modalModelos" tabindex="-1" aria-labelledby="modalModelosLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow rounded-4">
      
      <div class="modal-header border-bottom-0 pt-4 px-4">
        <h5 class="modal-title fw-bold fs-4 text-dark" id="modalModelosLabel">
          Modelos Disponibles<span class="text-primary"></span>
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body px-4 pb-4">
        <p class="text-muted small mb-3">Seleccione un modelo para ver sus especificaciones de mercado.</p>
        
        <div class="list-group rounded-3">
          <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center py-3" *ngFor="let m of modelos()">
            <span class="fw-medium text-dark">{{m.name}}</span>
          </div>
        </div>
      </div>

      <div class="modal-footer border-top-0 px-4 pb-4 pt-0">
        <button type="button" class="btn btn-secondary w-100 rounded-3 fw-semibold py-2" data-bs-dismiss="modal">Cerrar Lista</button>
      </div>

    </div>
  </div>
</div>
